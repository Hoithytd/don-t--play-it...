<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สนใจเล่นเกมไหม?</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body, html {
    width: 100%;
    height: 100%;
    background: #000;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* หน้าถามคำถาม */
#quiz-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

#quiz-overlay h1 {
    color: #fff;
    font-size: 2rem;
    margin-bottom: 30px;
    text-align: center;
}

.btn-group {
    display: flex;
    gap: 20px;
}

.quiz-btn {
    padding: 12px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    color: #fff;
    background: #e50914;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s;
}

.quiz-btn:hover {
    transform: scale(1.1);
}

/* วิดีโอเต็มจอ */
video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
</style>
</head>
<body>

<!-- หน้าต่างถามคำถามหลอกล่อ 555+ -->
<div id="quiz-overlay">
    <h1>สนใจเล่นเกมไหม?</h1>
    <div class="btn-group">
        <button class="quiz-btn" onclick="startVideo()">ไม่</button>
        <button class="quiz-btn" onclick="startVideo()">ไม่เล่น</button>
    </div>
</div>

<!-- วิดีโอ scary.mp4 -->
<video id="v" src="scary.mp4" loop playsinline></video>

<script>
function startVideo() {
    // ซ่อนหน้าถามคำถาม
    const overlay = document.getElementById('quiz-overlay');
    overlay.style.display = 'none';

    // พยายามเข้า Fullscreen
    const doc = document.documentElement;
    if (doc.requestFullscreen) {
        doc.requestFullscreen().catch(() => {});
    } else if (doc.webkitRequestFullscreen) {
        doc.webkitRequestFullscreen().catch(() => {});
    }

    const v = document.getElementById('v');

    // ระบบขยายเสียงทะลุเพดานด้วย Web Audio API
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaElementSource(v);
        
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -50;
        comp.knee.value = -50;
        comp.ratio.value = 20;

        const gain = ctx.createGain();
        gain.gain.value = 100.0; // เร่งความดัง 100 เท่าสะใจไปเลย 555+

        src.connect(comp);
        comp.connect(gain);
        gain.connect(ctx.destination);

        if (ctx.state === 'suspended') {
            ctx.resume();
        }
    } catch(e) {
        console.log(e);
    }

    v.volume = 1.0;
    v.play();
}
</script>
</body>
</html>
