
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jump Scare</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:#080808;color:white;
  font-family:sans-serif;display:flex;
  align-items:center;justify-content:center;
}
#home{text-align:center;padding:24px}
h1{font-size:32px;margin-bottom:32px}
.buttons{display:flex;justify-content:center;gap:16px}
button{
  border:0;border-radius:10px;padding:15px 30px;
  color:white;font-size:20px;font-weight:bold;
}
#yes{background:#168b42}
#no{background:#c62828}
#scareScreen{
  display:none;position:fixed;inset:0;
  width:100%;height:100%;background:black;
}
#scareVideo{
  width:100%;height:100%;object-fit:contain;
}
</style>
</head>
<body>

<div id="home">
  <h1>เล่นเกมไหม</h1>
  <div class="buttons">
    <button id="yes">เล่น</button>
    <button id="no">ไม่เล่น</button>
  </div>
</div>

<div id="scareScreen">
  <video id="scareVideo" loop playsinline preload="auto">
   <source src="scare.mp4" type="video/mp4">
  </video>
</div>

<script>
const home=document.getElementById("home");
const screen=document.getElementById("scareScreen");
const video=document.getElementById("scareVideo");

let audioContext;
let gainNode;
let sourceNode;

async function startScare(){
  home.style.display="none";
  screen.style.display="block";

  try{
    if(!audioContext){
      const AC=window.AudioContext||window.webkitAudioContext;

      if(!AC){
        await video.play();
        return;
      }

      audioContext=new AC();
      gainNode=audioContext.createGain();
      sourceNode=audioContext.createMediaElementSource(video);
      sourceNode.connect(gainNode);
      gainNode.connect(audioContext.destination);
    }

    await audioContext.resume();

    gainNode.gain.cancelScheduledValues(audioContext.currentTime);
    gainNode.gain.setValueAtTime(0.05,audioContext.currentTime);
    gainNode.gain.linearRampToValueAtTime(
      3,audioContext.currentTime+0.12
    );

    await video.play();
  }catch(error){
    console.error(error);
  }
}

document.getElementById("yes").addEventListener("click",startScare);
document.getElementById("no").addEventListener("click",startScare);
</script>

</body>
</html>
